apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    namespace = "app.pushuptracker.mobile"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "app.pushuptracker.mobile"
        // Health Connect (connect-client) работает с Android 8.0 (API 26); общий minSdk проекта — 24.
        minSdkVersion Math.max(rootProject.ext.minSdkVersion as int, 26)
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

kotlin {
    jvmToolchain(21)
}

// Отладка против локального сервера по http (эмулятор → 10.0.2.2): страница на https://localhost
// иначе не пустит запросы к http. allowMixedContent включается ТОЛЬКО в debug-копии
// capacitor.config.json (она перекрывает конфиг из main в отладочной сборке); релизный конфиг,
// который пишет `cap sync`, смешанный контент не разрешает при любом NATIVE_API_BASE.
def debugCapacitorAssets = layout.buildDirectory.dir("generated/debugCapacitorAssets")
tasks.register('debugCapacitorConfig') {
    def source = file('src/main/assets/capacitor.config.json')
    def target = debugCapacitorAssets.get().file('capacitor.config.json').asFile
    inputs.file(source)
    outputs.file(target)
    doLast {
        def config = new groovy.json.JsonSlurper().parse(source)
        config.android = (config.android ?: [:]) + [allowMixedContent: true]
        target.parentFile.mkdirs()
        target.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(config))
    }
}
android.sourceSets.debug.assets.srcDir(debugCapacitorAssets)
tasks.matching { it.name == 'mergeDebugAssets' }.configureEach { dependsOn 'debugCapacitorConfig' }

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // SecureToken: токен сессии в EncryptedSharedPreferences (ключ — в Android Keystore).
    implementation "androidx.security:security-crypto:$androidxSecurityCryptoVersion"
    // BackgroundUpload: отправка очереди тренировок при появлении сети, даже если приложение закрыто.
    implementation "androidx.work:work-runtime:2.10.2"
    // HealthBridge: запись тренировок в Health Connect (ExerciseSessionRecord + DistanceRecord).
    implementation "androidx.health.connect:connect-client:1.1.0"
    // connect-client тянет guava 31.1-android (runtime), из-за чего пустой listenablefuture вытесняет
    // ListenableFuture WorkManager с classpath компиляции. Та же guava — только для компиляции, новой библиотеки нет.
    compileOnly "com.google.guava:guava:31.1-android"
    // RepCounter: превью и кадры камеры (CameraX) + распознавание позы ML Kit (встроенная модель, без сети).
    implementation "androidx.camera:camera-camera2:1.4.2"
    implementation "androidx.camera:camera-lifecycle:1.4.2"
    implementation "androidx.camera:camera-view:1.4.2"
    implementation "com.google.mlkit:pose-detection:18.0.0-beta5"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
